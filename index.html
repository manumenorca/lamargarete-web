<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Margarete · Jardín de copas en Ciutadella, Menorca</title>
<meta name="description" content="Bar con jardín en una antigua fábrica de zapatos del casco antiguo de Ciutadella, Menorca. Carta, DJs los viernes y sábados, eventos privados y prebodas.">
<meta property="og:title" content="La Margarete, Ciutadella">
<meta property="og:description" content="Cócteles, jardín y DJs en el casco antiguo de Ciutadella.">
<meta property="og:type" content="website">
<link rel="alternate" hreflang="ca" href="?lang=ca">
<link rel="alternate" hreflang="es" href="?lang=es">
<link rel="alternate" hreflang="en" href="?lang=en">
<link rel="alternate" hreflang="fr" href="?lang=fr">
<meta name="theme-color" content="#16291F">
<meta property="og:image" content="https://www.lamargarete.com/fotos/jardin-lleno-noche.jpg">
<meta property="og:url" content="https://www.lamargarete.com/">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800;900&family=Figtree:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:"Marketing Script";src:url("fuentes/MarketingScript.ttf") format("truetype");font-display:swap}
  :root{
    --hoja:#16291F;      /* verde ficus oscuro */
    --ficus:#2C4A36;     /* verde hoja */
    --cal:#EDF0E9;       /* pared encalada */
    --mares:#D8B27A;     /* piedra de marès */
    --naranja:#FF8A00;   /* centro de la margarita */
    --naranja-texto:#B35400; /* naranja legible sobre fondo claro */
    --logo:"Marketing Script", cursive;
    --tinta:#1A221D;
    --gris:#5C6860;
    --display:"Big Shoulders Display", "Arial Narrow", sans-serif;
    --texto:"Figtree", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--texto);font-size:1.0625rem;line-height:1.55;color:var(--tinta);background:var(--cal);-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--naranja);outline-offset:3px;border-radius:4px}
  .envoltura{width:min(1120px,100% - 2.5rem);margin-inline:auto}

  /* ---------- Aviso ---------- */
  .aviso{background:var(--naranja);color:var(--tinta);text-align:center;padding:.55rem 1rem;font-weight:500;font-size:.95rem}

  /* ---------- Navegación ---------- */
  .nav{position:sticky;top:0;z-index:20;background:rgba(22,41,31,.92);backdrop-filter:blur(8px);color:var(--cal)}
  .nav .envoltura{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:3.5rem}
  .nav .marca{font-family:var(--logo);font-size:clamp(1.5rem,5vw,1.9rem);white-space:nowrap;text-decoration:none;line-height:1;display:flex;align-items:center;gap:.45rem}
  .nav .marca img{width:30px;height:auto}
  .nav ul{display:flex;gap:1.4rem;list-style:none}
  .nav ul a{text-decoration:none;font-weight:500;font-size:.98rem;opacity:.85;display:inline-block;padding:.75rem 0}
  .nav ul a:hover{opacity:1;color:var(--mares)}
  @media (max-width:560px){.nav ul{gap:.9rem;font-size:.92rem}.nav ul li.opc{display:none}}
  
  /* ---------- Portada ---------- */
  .portada{position:relative;background:var(--hoja);color:var(--cal);overflow:hidden;min-height:min(92vh,820px);display:flex;align-items:flex-end;isolation:isolate}
  .portada .foto{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}
  .portada .foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,41,31,.25) 0%,rgba(22,41,31,.85) 70%,var(--hoja) 100%)}
  .portada .flor{position:absolute;z-index:-1;right:-3%;top:1.5rem;width:min(40vw,500px);pointer-events:none;filter:drop-shadow(0 18px 40px rgba(0,0,0,.35))}
  @media (max-width:700px){.portada .flor{right:-18%;top:1.5rem;width:72vw}}
  .portada .envoltura{padding-block:clamp(14rem,30vw,22rem) 3rem}
  .rotulo{font-family:var(--logo);font-weight:400;line-height:.95;font-size:clamp(2.6rem,14.5vw,9.5rem);white-space:nowrap;color:var(--cal);text-shadow:0 4px 30px rgba(22,41,31,.6)}
  .rotulo span{display:inline-block}
  .portada .lema{font-size:clamp(1.15rem,2.4vw,1.45rem);max-width:30ch;margin-top:1.6rem;line-height:1.35}
  .portada .hoy{margin-top:.6rem;color:var(--naranja);font-weight:500}
  .botones{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem}
  .boton{display:inline-block;padding:.85rem 1.4rem;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid var(--mares);transition:background .2s,color .2s}
  .boton.lleno{background:var(--naranja);border-color:var(--naranja);color:var(--tinta)}
  .boton.lleno:hover{background:var(--cal);border-color:var(--cal)}
  .boton.linea{color:var(--cal);border-color:var(--cal)}
  .boton.linea:hover{background:var(--cal);color:var(--hoja)}
  @media (prefers-reduced-motion:no-preference){
    .portada .flor{animation:gira 1.4s cubic-bezier(.2,.8,.2,1) both}
    .rotulo span{animation:sube .9s .25s cubic-bezier(.2,.7,.2,1) both}
    @keyframes gira{from{transform:rotate(-120deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
    @keyframes sube{from{transform:translateY(.2em);opacity:0}to{transform:none;opacity:1}}
  }

  /* ---------- Secciones ---------- */
  section.bloque{padding-block:clamp(4rem,9vw,7rem)}
  h2{font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,7vw,4.8rem);line-height:.9;letter-spacing:.005em;margin-bottom:1.25rem}
  .intro{max-width:56ch;color:var(--gris);font-size:1.1rem}

  /* ---------- Carta ---------- */
  .carta-cab{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1.5rem;margin-bottom:2.25rem}
  .pestanas{display:flex;flex-wrap:wrap;gap:.5rem}
  .pestanas button{font:inherit;font-weight:500;font-size:.98rem;padding:.5rem 1rem;border-radius:999px;border:1.5px solid var(--ficus);background:transparent;color:var(--ficus);cursor:pointer}
  .pestanas button[aria-selected="true"]{background:var(--ficus);color:var(--cal)}
  .pestanas button:hover:not([aria-selected="true"]){background:rgba(44,74,54,.08)}
  .platos{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));column-gap:3.5rem}
  .plato{display:grid;grid-template-columns:1fr auto;gap:.15rem 1rem;padding:1.05rem 0;border-bottom:1px solid rgba(26,34,29,.14)}
  .plato .n{font-weight:700;font-size:1.1rem}
  .plato .p{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1;color:var(--naranja-texto);align-self:start}
  .plato .d{grid-column:1/-1;color:var(--gris);font-size:.97rem;max-width:46ch}
  .plato .varios{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.35rem 1.25rem;margin-top:.35rem}
  .plato .varios span{font-size:.95rem;color:var(--gris)}
  .plato .varios b{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--naranja-texto);margin-left:.35rem}
  .subtitulo{grid-column:1/-1;font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--ficus);padding-top:2rem;padding-bottom:.2rem;border-bottom:2px solid var(--ficus)}
  .subtitulo:first-child{padding-top:0}
  #t-carta{margin-bottom:.4rem}
  .carta-temporada{color:var(--naranja-texto);font-weight:700;font-size:1.1rem;letter-spacing:.02em}
  .nota-carta{margin-top:1.75rem;color:var(--gris);font-size:.93rem}

  /* ---------- Agenda ---------- */
  .agenda{background:var(--hoja);color:var(--cal)}
  .agenda .intro{color:rgba(237,240,233,.75)}
  .eventos{list-style:none;margin-top:2rem}
  .evento{display:grid;grid-template-columns:6.5rem 1fr;gap:1.5rem;align-items:center;padding:1.3rem 0;border-top:1px solid rgba(216,178,122,.3)}
  .evento:last-child{border-bottom:1px solid rgba(216,178,122,.3)}
  .evento .dia{font-family:var(--display);font-weight:900;font-size:3.2rem;line-height:.85;color:var(--naranja)}
  .evento .dia small{display:block;font-weight:500;font-size:1.05rem;line-height:1.2;margin-top:.3rem}
  .evento .t{font-weight:700;font-size:1.25rem}
  .evento .meta{color:rgba(237,240,233,.7);font-size:.95rem}
  .vacio{margin-top:2rem;padding:1.75rem;border:1.5px dashed rgba(216,178,122,.5);border-radius:14px;max-width:40rem}
  .vacio a{color:var(--naranja);font-weight:700}


  /* ---------- Eventos ---------- */
  .eventos-priv .rejilla{display:grid;grid-template-columns:1fr 1.1fr;gap:3rem;align-items:start}
  @media (max-width:800px){.eventos-priv .rejilla{grid-template-columns:1fr}}
  .eventos-priv .intro{color:var(--tinta);font-size:1.2rem;max-width:34ch}
  .eventos-priv .alt{margin-top:1.25rem;color:var(--gris)}
  .eventos-priv .alt a{font-weight:700;text-decoration-color:var(--naranja);text-underline-offset:3px}
  form.solicitud{background:#fff;border-radius:18px;padding:clamp(1.25rem,3vw,2rem);display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.25rem;box-shadow:0 1px 0 rgba(26,34,29,.08)}
  form.solicitud .ancho{grid-column:1/-1}
  @media (max-width:600px){form.solicitud{grid-template-columns:1fr}}
  form.solicitud label{min-width:0}
  form.solicitud input,form.solicitud select,form.solicitud textarea{min-width:0;max-width:100%;display:block;min-height:2.9rem}
  form.solicitud input[type="date"]{-webkit-appearance:none;appearance:none;text-align:left}
  form.solicitud input[type="date"]::-webkit-date-and-time-value{text-align:left}
  form.solicitud label{display:flex;flex-direction:column;gap:.35rem;font-weight:500;font-size:.95rem}
  form.solicitud input,form.solicitud select,form.solicitud textarea{font:inherit;font-size:1rem;padding:.7rem .8rem;border:1.5px solid rgba(26,34,29,.25);border-radius:10px;background:var(--cal);color:var(--tinta);width:100%}
  form.solicitud textarea{min-height:6rem;resize:vertical}
  form.solicitud input:focus,form.solicitud select:focus,form.solicitud textarea:focus{outline:none;border-color:var(--ficus);box-shadow:0 0 0 3px rgba(255,138,0,.35)}
  form.solicitud button{font:inherit;font-weight:700;cursor:pointer;justify-self:start;background:var(--naranja);border-color:var(--naranja);color:var(--tinta)}
  form.solicitud button:hover{background:var(--hoja);border-color:var(--hoja);color:var(--cal)}
  form.solicitud .ayuda{grid-column:1/-1;color:var(--gris);font-size:.88rem}


  /* ---------- La puerta ---------- */
  .puerta-sec .rejilla{display:grid;grid-template-columns:1fr minmax(280px,440px);gap:clamp(2rem,6vw,5rem);align-items:center}
  @media (max-width:760px){.puerta-sec .rejilla{grid-template-columns:1fr}}
  .puerta-sec h2{font-size:clamp(2.6rem,6.2vw,4.6rem);max-width:12ch}
  .puerta-sec .intro{color:var(--tinta);font-size:1.15rem;max-width:36ch}
  .puerta-sec .revelado{margin-top:1rem;font-size:1.15rem;font-weight:700;color:var(--ficus);max-width:36ch;min-height:3em}
  .puerta{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;perspective:1800px;background:var(--hoja) center 70%/cover no-repeat;cursor:pointer;border:0;padding:0;width:100%;display:block;box-shadow:0 30px 60px -30px rgba(22,41,31,.6)}
  .puerta .hoja-p{position:absolute;top:0;bottom:0;width:50%;background-repeat:no-repeat;background-size:200% auto;transition:transform 1.5s cubic-bezier(.65,0,.25,1);backface-visibility:hidden;will-change:transform}
  .puerta .izq{left:0;background-position:0% 75%;transform-origin:left center}
  .puerta .der{right:0;background-position:100% 75%;transform-origin:right center}
  .puerta.abierta .izq{transform:rotateY(-108deg)}
  .puerta.abierta .der{transform:rotateY(108deg)}
  .puerta .pista{position:absolute;left:50%;bottom:1.25rem;transform:translateX(-50%);background:var(--naranja);color:var(--tinta);font-weight:700;padding:.7rem 1.3rem;border-radius:999px;white-space:nowrap;transition:opacity .4s;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .puerta.abierta .pista{opacity:0}
  .puerta .pie{position:absolute;left:1rem;bottom:.9rem;color:#fff;font-size:.9rem;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.7);opacity:0;transition:opacity .6s 1s}
  .puerta.abierta .pie{opacity:1}
  .otra-vez{margin-top:1.25rem;font:inherit;font-weight:500;background:none;border:0;color:var(--gris);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
  .otra-vez[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){.puerta .hoja-p{transition:none}.puerta.abierta .hoja-p{opacity:0}}

  /* ---------- DJs con foto ---------- */
  .agenda .rejilla{display:grid;grid-template-columns:1.1fr minmax(240px,380px);gap:clamp(2rem,6vw,5rem);align-items:center}
  @media (max-width:760px){.agenda .rejilla{grid-template-columns:1fr}}
  .foto-dj{border-radius:18px;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center 60%}


  /* ---------- Retratos ---------- */
  .retratos{margin-top:clamp(3rem,7vw,5rem);display:grid;grid-template-columns:minmax(220px,1fr) 3fr;gap:2rem;align-items:center}
  @media (max-width:760px){.retratos{grid-template-columns:1fr}}
  .retratos-t{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4.5vw,2.8rem);line-height:.95;color:var(--ficus);margin-bottom:.75rem}
  .retratos p{font-size:1.15rem;max-width:30ch}
  .retratos .etiqueta{margin-top:1.1rem}
  .retratos .fila{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
  @media (max-width:520px){.retratos .fila{grid-template-columns:repeat(2,1fr)}}
  .retratos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}

  /* ---------- Cartel de la entrada ---------- */
  .tarjeta-mapa.con-foto{background-size:cover;background-position:center 60%;min-height:20rem;display:flex;flex-direction:column;justify-content:flex-end}
  .tarjeta-mapa.con-foto::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(22,41,31,.85))}


  /* ---------- Ajustes para móvil ---------- */
  section[id]{scroll-margin-top:3.5rem}
  @media (max-width:640px){
    section.bloque{padding-block:3.5rem}
    .pestanas{flex-wrap:nowrap;overflow-x:auto;margin-inline:-1.25rem;padding:0 1.25rem .4rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .pestanas::-webkit-scrollbar{display:none}
    .pestanas button{flex:none;padding:.6rem 1.05rem}
    .carta-cab{margin-bottom:1.25rem}
    .botones .boton{flex:1 1 100%;text-align:center}
    .portada{min-height:auto}
    .portada .envoltura{padding-block:14rem 2.5rem}
    .puerta-sec .rejilla{gap:1.5rem}
    .puerta{max-width:420px;margin-inline:auto}
    .agenda .foto-dj{aspect-ratio:4/3}
    .evento{grid-template-columns:4.5rem 1fr;gap:1rem}
    .portada .flor{width:min(56vw,260px);top:.75rem;right:-10%}
    footer .marca{font-size:2.6rem;white-space:nowrap}
  }
  @media (max-width:400px){
    .nav .marca{font-size:1.3rem;gap:.3rem}
    .nav .marca img{width:24px}
    .nav ul{gap:.7rem;font-size:.88rem}
  }

  /* ---------- Fotos ---------- */
  .galeria{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:clamp(130px,17vw,220px);gap:.75rem;margin-top:2.25rem}
  .galeria figure{position:relative;border-radius:14px;overflow:hidden;background:var(--ficus)}
  .galeria figure:nth-child(6n+1){grid-column:span 4;grid-row:span 2}
  .galeria figure:nth-child(6n+2),.galeria figure:nth-child(6n+3){grid-column:span 2}
  .galeria figure:nth-child(6n+4),.galeria figure:nth-child(6n+5),.galeria figure:nth-child(6n+6){grid-column:span 2}
  .galeria img{width:100%;height:100%;object-fit:cover}
  .galeria figure:not(.hueco)::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none}
  .galeria figcaption{z-index:1;position:absolute;left:.75rem;bottom:.6rem;color:#fff;font-size:.88rem;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .galeria .hueco{display:flex;align-items:center;justify-content:center;color:rgba(237,240,233,.55);font-size:.95rem;text-align:center;padding:1rem;background:repeating-linear-gradient(135deg,var(--ficus) 0 14px,#30513b 14px 28px)}
  @media (max-width:700px){
    .galeria{grid-template-columns:1fr 1fr}
    .galeria figure:nth-child(n){grid-column:span 1;grid-row:span 1}
    .galeria figure:nth-child(3n+1){grid-column:span 2}
  }

  /* ---------- Dónde ---------- */
  .donde .rejilla{display:grid;grid-template-columns:1.2fr 1fr;gap:3rem;align-items:start}
  @media (max-width:800px){.donde .rejilla{grid-template-columns:1fr}}
  .direccion{font-size:1.35rem;line-height:1.35;font-weight:500;margin-bottom:1.5rem}
  .horario{list-style:none;margin-bottom:1.75rem}
  .horario li{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:1px solid rgba(26,34,29,.14);max-width:26rem}
  .horario li span:last-child{font-weight:700}
  .contacto a{font-weight:700;text-decoration-color:var(--naranja);text-underline-offset:3px}
  .tarjeta-mapa{display:block;text-decoration:none;background:var(--ficus);color:var(--cal);border-radius:18px;padding:2rem;min-height:15rem;position:relative;overflow:hidden}
  .tarjeta-mapa svg{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
  .tarjeta-mapa strong{position:relative;font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;display:block}
  .tarjeta-mapa span{position:relative;display:inline-block;margin-top:.75rem;font-weight:500;border-bottom:2px solid var(--mares)}
  .tarjeta-mapa:hover span{color:var(--naranja)}
  .boton.oscuro{color:var(--hoja);border-color:var(--hoja)}
  .boton.oscuro:hover{background:var(--hoja);color:var(--cal)}

  /* ---------- Pie ---------- */
  footer{background:var(--tinta);color:var(--cal);padding-block:3.5rem 2.5rem}
  footer .envoltura{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2rem;align-items:end}
  footer .marca{font-family:var(--logo);font-size:clamp(3rem,7vw,4.5rem);line-height:1;color:var(--cal);display:flex;align-items:center;gap:1rem}
  footer .marca img{width:clamp(56px,8vw,84px)}
  .redes{display:flex;flex-wrap:wrap;gap:.6rem;list-style:none}
  .redes a{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.05rem;border-radius:999px;border:1.5px solid rgba(237,240,233,.35);text-decoration:none;font-weight:500}
  .redes a:hover{border-color:var(--naranja);color:var(--naranja)}
  .redes svg{width:18px;height:18px}
  .legal{width:100%;color:rgba(237,240,233,.5);font-size:.85rem}

  /* ---------- Idiomas ---------- */
  .nav ul{margin-left:auto}
  .idiomas{display:flex;gap:.1rem;margin-left:1rem}
  .idiomas button{font:inherit;font-size:.8rem;font-weight:700;letter-spacing:.02em;color:var(--cal);background:none;border:1.5px solid transparent;border-radius:999px;min-width:2.4rem;min-height:2.4rem;padding:0 .4rem;cursor:pointer;opacity:.7}
  .idiomas button:hover{opacity:1}
  .idiomas button[aria-pressed="true"]{border-color:var(--naranja);color:var(--naranja);opacity:1}
  @media (max-width:520px){.nav ul li.mov-oculto{display:none}.idiomas{margin-left:.5rem}}
  @media (max-width:440px){.nav ul{display:none}.idiomas{margin-left:auto}}
  @media (max-width:400px){.idiomas button{min-width:2.3rem;font-size:.76rem;padding:0 .25rem}}
</style>
</head>
<body>

<div class="aviso" id="aviso" hidden></div>

<nav class="nav" aria-label="Principal" id="navPrincipal">
  <div class="envoltura">
    <a class="marca" href="#inicio"><img src="img/margarita.png" alt="">la margarete</a>
    <ul>
      <li><a href="#carta" data-t="navCarta"></a></li>
      <li class="opc"><a href="#agenda">DJs</a></li>
      <li class="opc"><a href="#fotos" data-t="navFotos"></a></li>
      <li class="mov-oculto"><a href="#donde" data-t="navDonde"></a></li>
      <li class="mov-oculto"><a href="#eventos" data-t="navEventos"></a></li>
    </ul>
    <div class="idiomas" role="group" id="idiomas">
      <button type="button" data-lang="ca" lang="ca" aria-label="Català">CA</button>

    "Copa":       { es: "Copa", ca: "Copa", en: "Glass", fr: "Verre" },

    const falta = [...f.querySelectorAll("[required]")].find(i => !i.value.trim());
    if (falta) { $("ayudaForm").textContent = U("fFalta") + " " + falta.closest("label").querySelector("span").textContent.trim() + "."; falta.focus(); return; }
    const fecha = new Date(d.fecha + "T12:00").toLocaleDateString(LOCALE[L], { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    const asunto = U("mAsunto").replace("{tipo}", d.tipo).replace("{fecha}", fecha).replace("{n}", d.personas);
    const cuerpo = `${U("mSaludo")}\n\n${U("fTipo")}: ${d.tipo}\n${U("fFecha")}: ${fecha}\n${U("fPersonas")}: ${d.personas}\n${U("fNombre")}: ${d.nombre}\n${U("fContacto")}: ${d.contacto}\n\n${d.mensaje || ""}`;
    location.href = `mailto:${E.email}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
    $("ayudaForm").textContent = U("fAbierto") + " " + E.email + ".";
  });

  // ---------- La puerta ----------
  let puertaAbierta = false;
  function ponPuerta(abierta) {
    puertaAbierta = abierta;
    const b = $("puertaBtn");
    b.classList.toggle("abierta", abierta);
    b.setAttribute("aria-pressed", abierta);
    b.setAttribute("aria-label", abierta ? U("cerrarPuerta") : U("abrePuerta"));
    $("revelado").textContent = abierta ? U("revelado") : "";
    $("cerrarPuerta").hidden = !abierta;
  }
  if (M.puerta) {
    const b = $("puertaBtn");
    b.style.backgroundImage = `url("${M.puerta.detras}")`;
    b.querySelectorAll(".hoja-p").forEach(h => h.style.backgroundImage = `url("${M.puerta.foto}")`);
    b.addEventListener("click", () => ponPuerta(!puertaAbierta));
    $("cerrarPuerta").addEventListener("click", () => ponPuerta(false));
  } else { $("puerta").hidden = true; }

  // ---------- Todo lo que cambia con el idioma ----------
  function pintar() {
    document.documentElement.lang = L;
    document.title = U("titulo");
    document.querySelector('meta[name="description"]').content = U("descripcion");
    document.querySelectorAll("[data-t]").forEach(el => el.textContent = U(el.dataset.t));
    document.querySelectorAll("[data-t-ph]").forEach(el => el.placeholder = U(el.dataset.tPh));
    document.querySelectorAll("#idiomas button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L));
    $("idiomas").setAttribute("aria-label", U("idioma"));
    pest.setAttribute("aria-label", U("cartaSecciones"));
    $("redes").setAttribute("aria-label", U("redes"));

    // Aviso
    const aviso = T(M.aviso);
    $("aviso").textContent = aviso; $("aviso").hidden = !aviso;

    // Portada
    $("lema").textContent = T(M.lema);
    $("hoy").textContent = (M.horario || []).map(h => { const hs = T(h.horas); return `${T(h.dias)}${L === "fr" ? " : " : ": "}${hs.charAt(0).toLowerCase() + hs.slice(1)}`; }).join(". ");

    // Carta
    [...pest.children].forEach((b, i) => b.textContent = T(secciones[i].seccion));
    $("notaCarta").textContent = T(M.notaCarta);
    if (secciones.length) mostrar(seccionActual);
    if (M.cartaPdf) { const p = $("pdf"); p.querySelector("a").href = M.cartaPdf; p.hidden = false; }

    // Eventos
    $("eventosTexto").textContent = T(E.texto);
    $("eventosAlt").innerHTML = E.email ? `${esc(U("eventosAlt"))} <a href="mailto:${esc(E.email)}">${esc(E.email)}</a>.` : "";
    const sel = $("tipoEvento"), elegido = sel.selectedIndex;
    sel.innerHTML = `<option value="">${esc(U("fElige"))}</option>` + (E.tipos || []).map(t => `<option>${esc(T(t))}</option>`).join("");
    sel.selectedIndex = Math.max(0, elegido);
    $("ayudaForm").textContent = U("fAyuda");

    // Puerta
    ponPuerta(puertaAbierta);

    // Agenda
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    const prox = (M.agenda || []).filter(e => new Date(e.fecha + "T23:59") >= hoy).sort((a, b) => a.fecha.localeCompare(b.fecha));
    if (prox.length) {
      $("listaDJ").innerHTML = `<ul class="eventos">` + prox.map(e => {
        const d = new Date(e.fecha + "T12:00");
        const dia = d.toLocaleDateString(LOCALE[L], { day: "numeric" });
        const resto = d.toLocaleDateString(LOCALE[L], { weekday: "short", month: "short" });
        return `<li class="evento"><div class="dia">${dia}<small>${esc(resto)}</small></div><div><div class="t">${esc(T(e.titulo))}</div><div class="meta">${esc([T(e.tipo), e.hora].filter(Boolean).join(", "))}</div></div></li>`;
      }).join("") + `</ul>`;
    } else {
      $("listaDJ").innerHTML = `<div class="vacio"><p>${esc(T(M.agendaVacia))}</p>${ig ? `<p style="margin-top:.75rem"><a href="${esc(ig.url)}" target="_blank" rel="noopener">${esc(U("seguirIg"))}</a></p>` : ""}</div>`;
    }
    $("fotoDJ").alt = U("djAlt");

    // Fotos
    $("presentacion").textContent = T(M.presentacion);
    $("galeria").innerHTML = (M.fotos || []).map(f => `<figure><img src="${esc(f.archivo)}" alt="${esc(T(f.texto))}" loading="lazy">${T(f.texto) ? `<figcaption>${esc(T(f.texto))}</figcaption>` : ""}</figure>`).join("");

    // Las actrices de la ventana
    const R = M.retratos;
    if (R && R.fotos && R.fotos.length) {
      $("retratosTitulo").textContent = T(R.titulo);
      $("retratosTexto").textContent = T(R.texto);
      if (R.etiqueta && ig) { const e = $("retratosEtiqueta"); e.querySelector("a").href = ig.url; e.querySelector("a").textContent = R.etiqueta; e.hidden = false; }
      $("retratosFila").innerHTML = R.fotos.map(f => `<img src="${esc(f)}" alt="${esc(U("estampitaAlt"))}" loading="lazy">`).join("");
      $("retratos").hidden = false;
    }

    // Dónde
    $("mapaTitulo").textContent = M.fotoEntrada ? U("buscaCartel") : U("mapaTitulo");
    $("horario").innerHTML = (M.horario || []).map(h => `<li><span>${esc(T(h.dias))}</span><span>${esc(T(h.horas))}</span></li>`).join("");
    $("reservas").textContent = T(M.reservas);
    const c = [];
    if (M.email) c.push(`Email: <a href="mailto:${esc(M.email)}">${esc(M.email)}</a>`);
    $("contacto").innerHTML = c.join("<br>");
  }

  function cambiarIdioma(nuevo) {
    L = nuevo;
    try { localStorage.setItem("idioma", L); } catch (e) {}
    try { const u = new URL(location.href); u.searchParams.set("lang", L); history.replaceState(null, "", u); } catch (e) {}
    pintar();
  }
  document.querySelectorAll("#idiomas button").forEach(b => b.addEventListener("click", () => cambiarIdioma(b.dataset.lang)));

  L = elegirIdioma();
  pintar();
})();
</script>
</body>
</html>
